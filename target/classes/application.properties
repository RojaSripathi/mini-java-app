# Mini Java App Configuration - Containerization-Ready

# Server configuration (overridable via environment variables)
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:localhost}
server.context-path=${SERVER_CONTEXT_PATH:/mini-app}

# Database configuration (overridable via environment variables)
database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mini_app_db}
database.username=${DATABASE_USERNAME:root}
database.password=${DATABASE_PASSWORD:password123}
database.driver=com.mysql.cj.jdbc.Driver
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:5000}

# Cache configuration (overridable via environment variables)
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:redis_secret_123}
cache.redis.database=${REDIS_DATABASE:0}

# External service URLs (overridable via environment variables)
external.api.base-url=${EXTERNAL_API_BASE_URL:http://api.example.com:8080/v1}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:hardcoded_api_key_12345}

payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}
payment.service.username=${PAYMENT_SERVICE_USERNAME:payment_user}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:payment_secret_456}

# File paths (overridable via environment variables)
app.config.directory=${APP_CONFIG_DIRECTORY:/opt/app/config}
app.log.directory=${APP_LOG_DIRECTORY:/var/log/mini-app}
app.temp.directory=${APP_TEMP_DIRECTORY:/tmp/mini-app}
app.upload.directory=${APP_UPLOAD_DIRECTORY:/opt/uploads}

# Security configuration (overridable via environment variables)
security.jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_123456789}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin123}
security.encryption.key=${ENCRYPTION_KEY:encryption_key_hardcoded}

# Monitoring/metrics endpoints (overridable via environment variables)
monitoring.endpoint=${MONITORING_ENDPOINT:http://monitoring.internal.company.com:9090/metrics}
monitoring.username=${MONITORING_USERNAME:monitor_user}
monitoring.password=${MONITORING_PASSWORD:monitor_pass}

# Messaging configuration (overridable via environment variables)
messaging.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.internal.company.com}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq_user}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq_secret}

# Environment-specific values (overridable via environment variables)
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOGGING_LEVEL:INFO}
