# Mini Java App Configuration - Cloud-Ready (AWS)
# All sensitive values have been externalized to AWS Secrets Manager and
# AWS Systems Manager (SSM) Parameter Store.
# Hard-coded credentials, ports, and file paths have been removed.

# ---------------------------------------------------------------------------
# Server configuration
# blocker-14,15: port resolved at runtime from SERVER_PORT env var or
#                SSM Parameter Store /mini-app/server/port
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration
# blocker-8,9,10,16: credentials retrieved from AWS Secrets Manager at runtime.
#   Secret name is supplied via DB_SECRET_NAME environment variable.
#   Secret JSON format: { "username":"...", "password":"...", "host":"...", "dbname":"..." }
# blocker-11,12: DB port retrieved from SSM Parameter Store /mini-app/db/port
#   or DB_PORT environment variable.
# blocker-17,18: HikariCP connection pool used instead of raw JDBC.
# blocker-19: connection timeouts configured in HikariCP (see DatabaseService.java).
# ---------------------------------------------------------------------------
db.secret.name=${DB_SECRET_NAME:mini-app/db/credentials}
db.host=${DB_HOST:localhost}
db.name=${DB_NAME:mini_app_db}
db.port.param=${DB_PORT_PARAM:/mini-app/db/port}

# HikariCP pool settings
database.pool.max-connections=20
database.pool.connection-timeout=30000
database.pool.idle-timeout=600000
database.pool.max-lifetime=1800000

# ---------------------------------------------------------------------------
# Cache configuration
# blocker-13: Redis host/port retrieved from SSM Parameter Store at runtime.
#   Parameter names supplied via REDIS_HOST_PARAM / REDIS_PORT_PARAM env vars.
# ---------------------------------------------------------------------------
cache.redis.host.param=${REDIS_HOST_PARAM:/mini-app/cache/host}
cache.redis.port.param=${REDIS_PORT_PARAM:/mini-app/cache/port}

# ---------------------------------------------------------------------------
# External service URLs
# Supplied via environment variables at deployment time (ECS/EKS task definition).
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
external.api.timeout=30000
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}

# ---------------------------------------------------------------------------
# Amazon S3 storage configuration
# blocker-1,2,3,4,5,6,7: file paths replaced with S3 bucket/key references.
# ---------------------------------------------------------------------------
aws.s3.bucket=${S3_BUCKET_NAME:mini-app-config}
aws.s3.config-key=${S3_CONFIG_KEY:config/app.properties}
aws.s3.log-key=${S3_LOG_KEY:logs/mini-app.log}

# ---------------------------------------------------------------------------
# AWS SSM Parameter Store – application configuration
# blocker-20: classpath properties file replaced with SSM Parameter Store.
# ---------------------------------------------------------------------------
aws.ssm.config-prefix=/mini-app/config/

# ---------------------------------------------------------------------------
# AWS region
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
environment=${APP_ENV:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
