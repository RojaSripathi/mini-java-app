# Mini Java App Configuration — Cloud-Ready (AWS)
# -----------------------------------------------------------------------
# All sensitive values and environment-specific settings have been
# externalized to AWS Systems Manager Parameter Store and AWS Secrets
# Manager.  Hard-coded credentials, ports, file paths, and API keys
# have been removed.
# -----------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Server configuration
# Port is resolved at runtime from AWS SSM Parameter Store.
# SSM parameter name is supplied via the SSM_PARAM_SERVER_PORT env variable.
# Fallback: PORT environment variable, then 8080.
# (blocker-14, blocker-15)
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# AWS region
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Database configuration
# Credentials are stored in AWS Secrets Manager.
# Host, port, and DB name are stored in AWS SSM Parameter Store.
# (blocker-8, blocker-9, blocker-10, blocker-11, blocker-12, blocker-13, blocker-16, blocker-17, blocker-18, blocker-19)
# ---------------------------------------------------------------------------
# SSM parameter names (override via environment variables)
ssm.param.db.host=${SSM_PARAM_DB_HOST:/mini-app/db/host}
ssm.param.db.port=${SSM_PARAM_DB_PORT:/mini-app/db/port}
ssm.param.db.name=${SSM_PARAM_DB_NAME:/mini-app/db/name}

# Secrets Manager secret name for DB credentials
secret.db.credentials=${SECRET_DB_CREDENTIALS:mini-app/db/credentials}

# HikariCP connection pool settings (blocker-17, blocker-18, blocker-19)
hikari.maximum-pool-size=10
hikari.minimum-idle=2
hikari.connection-timeout=30000
hikari.idle-timeout=600000
hikari.max-lifetime=1800000
hikari.keepalive-time=60000

# ---------------------------------------------------------------------------
# Cache (Redis) configuration
# Host and port are stored in AWS SSM Parameter Store.
# (blocker-11, blocker-12, blocker-13)
# ---------------------------------------------------------------------------
ssm.param.cache.redis.host=${SSM_PARAM_REDIS_HOST:/mini-app/cache/host}
ssm.param.cache.redis.port=${SSM_PARAM_REDIS_PORT:/mini-app/cache/port}
# Redis password stored in AWS Secrets Manager
secret.cache.redis.credentials=${SECRET_REDIS_CREDENTIALS:mini-app/cache/credentials}

# ---------------------------------------------------------------------------
# External service URLs
# Stored in AWS SSM Parameter Store — no hard-coded URLs.
# ---------------------------------------------------------------------------
ssm.param.external.api.url=${SSM_PARAM_EXTERNAL_API_URL:/mini-app/external/api-url}
ssm.param.payment.service.url=${SSM_PARAM_PAYMENT_SERVICE_URL:/mini-app/external/payment-url}
# API key stored in AWS Secrets Manager
secret.external.api.key=${SECRET_EXTERNAL_API_KEY:mini-app/external/api-key}

# ---------------------------------------------------------------------------
# File / storage configuration
# All file-path-based operations replaced with Amazon S3.
# (blocker-1, blocker-2, blocker-3, blocker-4, blocker-5, blocker-6, blocker-7)
# ---------------------------------------------------------------------------
s3.bucket.name=${S3_BUCKET_NAME:mini-app-storage}
s3.config.key=${S3_CONFIG_KEY:config/app.properties}
s3.log.key=${S3_LOG_KEY:logs/mini-app.log}
s3.upload.prefix=${S3_UPLOAD_PREFIX:uploads/}

# ---------------------------------------------------------------------------
# Application configuration — resolved from AWS SSM Parameter Store (blocker-20)
# ---------------------------------------------------------------------------
ssm.param.app.environment=${SSM_PARAM_APP_ENV:/mini-app/config/environment}
ssm.param.log.level=${SSM_PARAM_LOG_LEVEL:/mini-app/config/log-level}

# ---------------------------------------------------------------------------
# Security configuration
# All secrets (JWT key, admin credentials, encryption key) are stored in
# AWS Secrets Manager — never in source code or property files.
# (blocker-16)
# ---------------------------------------------------------------------------
secret.security.jwt=${SECRET_SECURITY_JWT:mini-app/security/jwt}
secret.security.admin=${SECRET_SECURITY_ADMIN:mini-app/security/admin}
secret.security.encryption=${SECRET_SECURITY_ENCRYPTION:mini-app/security/encryption}

# ---------------------------------------------------------------------------
# Monitoring configuration
# Endpoint and credentials stored in AWS SSM Parameter Store / Secrets Manager.
# ---------------------------------------------------------------------------
ssm.param.monitoring.endpoint=${SSM_PARAM_MONITORING_ENDPOINT:/mini-app/monitoring/endpoint}
secret.monitoring.credentials=${SECRET_MONITORING_CREDENTIALS:mini-app/monitoring/credentials}

# ---------------------------------------------------------------------------
# Messaging configuration
# RabbitMQ host and port stored in AWS SSM Parameter Store.
# Credentials stored in AWS Secrets Manager.
# ---------------------------------------------------------------------------
ssm.param.messaging.rabbitmq.host=${SSM_PARAM_RABBITMQ_HOST:/mini-app/messaging/rabbitmq/host}
ssm.param.messaging.rabbitmq.port=${SSM_PARAM_RABBITMQ_PORT:/mini-app/messaging/rabbitmq/port}
secret.messaging.rabbitmq.credentials=${SECRET_RABBITMQ_CREDENTIALS:mini-app/messaging/rabbitmq/credentials}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.test=${LOG_LEVEL_APP:INFO}
