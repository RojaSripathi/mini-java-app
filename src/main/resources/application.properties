# Mini Java App Configuration - Cloud-Ready (AWS)
# All sensitive values and environment-specific settings are externalized.
# Secrets are stored in AWS Secrets Manager; parameters in AWS SSM Parameter Store.
# This file contains only non-sensitive defaults and documentation.

# ---------------------------------------------------------------------------
# Server configuration
# Port is resolved at runtime from:
#   1. AWS SSM Parameter Store: /mini-app/server/port
#   2. Environment variable:    SERVER_PORT
#   3. Default:                 8080
# ---------------------------------------------------------------------------
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# AWS region (override via environment variable AWS_REGION)
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Amazon S3 – application storage (config files, logs, uploads)
# Set via environment variables: APP_S3_BUCKET, APP_S3_CONFIG_KEY, APP_S3_LOG_KEY
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.s3.config-key=${APP_S3_CONFIG_KEY:config/app.properties}
app.s3.log-key=${APP_S3_LOG_KEY:logs/mini-app.log}

# ---------------------------------------------------------------------------
# AWS SSM Parameter Store – parameter names for runtime configuration
# ---------------------------------------------------------------------------
ssm.param.server.port=${SSM_SERVER_PORT_PARAM:/mini-app/server/port}
ssm.param.db.host=${SSM_DB_HOST_PARAM:/mini-app/db/host}
ssm.param.db.port=${SSM_DB_PORT_PARAM:/mini-app/db/port}
ssm.param.db.name=${SSM_DB_NAME_PARAM:/mini-app/db/name}

# ---------------------------------------------------------------------------
# AWS Secrets Manager – secret names (values resolved at runtime, NOT here)
# ---------------------------------------------------------------------------
secrets.db.credentials=${DB_SECRET_NAME:mini-app/db/credentials}

# ---------------------------------------------------------------------------
# HikariCP connection pool defaults (tunable via environment variables)
# ---------------------------------------------------------------------------
hikari.maximum-pool-size=20
hikari.minimum-idle=5
hikari.connection-timeout=30000
hikari.idle-timeout=600000
hikari.max-lifetime=1800000

# ---------------------------------------------------------------------------
# External service URLs – resolved from environment variables
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:http://api.example.com/v1}
payment.service.url=${PAYMENT_SERVICE_URL:https://payment.internal.company.com/process}

# ---------------------------------------------------------------------------
# Cache (Redis) – resolved from environment variables
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:127.0.0.1}
cache.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level=INFO
