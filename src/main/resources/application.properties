# Mini Java App Configuration - Cloud-Ready (AWS)
# All sensitive values and environment-specific settings are externalized.
# Secrets are stored in AWS Secrets Manager; configuration in AWS SSM Parameter Store.
# Values below use Spring-style ${ENV_VAR:default} placeholders so they are
# injected at runtime by ECS / EKS / Elastic Beanstalk environment variables.

# ---------------------------------------------------------------------------
# Server configuration
# Port is injected via SERVER_PORT environment variable or SSM Parameter Store.
# Hard-coded value removed (cr-java-0077).
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.host=${SERVER_HOST:0.0.0.0}
server.context-path=/mini-app

# ---------------------------------------------------------------------------
# Database configuration
# Credentials are retrieved from AWS Secrets Manager at runtime (cr-java-0069, cr-java-0113).
# The secret name is provided via DB_SECRET_NAME environment variable.
# Hard-coded URL, username, and password removed.
# ---------------------------------------------------------------------------
database.secret.name=${DB_SECRET_NAME:mini-app/db-credentials}
database.pool.max-connections=${DB_POOL_MAX_CONNECTIONS:20}
database.pool.timeout=${DB_POOL_TIMEOUT:30000}

# ---------------------------------------------------------------------------
# Cache configuration
# Host and port injected via environment variables or SSM Parameter Store.
# Hard-coded IPs and passwords removed (cr-java-0069, cr-java-0077).
# ---------------------------------------------------------------------------
cache.redis.host=${REDIS_HOST:}
cache.redis.port=${REDIS_PORT:6379}
cache.redis.password=${REDIS_PASSWORD:}
cache.redis.database=${REDIS_DATABASE:0}

# ---------------------------------------------------------------------------
# External service URLs
# Injected via environment variables – no hard-coded endpoints.
# ---------------------------------------------------------------------------
external.api.base-url=${EXTERNAL_API_URL:}
external.api.timeout=${EXTERNAL_API_TIMEOUT:30000}
external.api.key=${EXTERNAL_API_KEY:}

payment.service.url=${PAYMENT_SERVICE_URL:}
payment.service.username=${PAYMENT_SERVICE_USERNAME:}
payment.service.password=${PAYMENT_SERVICE_PASSWORD:}

# ---------------------------------------------------------------------------
# File / storage configuration
# Absolute local paths replaced with Amazon S3 references (cr-java-0061, cr-java-0063).
# ---------------------------------------------------------------------------
app.s3.bucket=${APP_S3_BUCKET:mini-app-storage}
app.config.s3.key=${APP_CONFIG_S3_KEY:config/app.properties}
app.log.s3.key=${APP_LOG_S3_KEY:logs/mini-app.log}
app.temp.s3.key=${APP_TEMP_S3_KEY:temp/}
app.upload.s3.key=${APP_UPLOAD_S3_KEY:uploads/}

# ---------------------------------------------------------------------------
# Security configuration
# All secrets retrieved from AWS Secrets Manager – no hard-coded keys (cr-java-0113).
# ---------------------------------------------------------------------------
security.jwt.secret.name=${JWT_SECRET_NAME:mini-app/jwt-secret}
security.admin.secret.name=${ADMIN_SECRET_NAME:mini-app/admin-credentials}
security.encryption.key.name=${ENCRYPTION_KEY_NAME:mini-app/encryption-key}

# ---------------------------------------------------------------------------
# Monitoring / metrics
# Endpoints and credentials injected via environment variables.
# ---------------------------------------------------------------------------
monitoring.endpoint=${MONITORING_ENDPOINT:}
monitoring.username=${MONITORING_USERNAME:}
monitoring.password=${MONITORING_PASSWORD:}

# ---------------------------------------------------------------------------
# Messaging configuration
# Credentials injected via environment variables or AWS Secrets Manager.
# ---------------------------------------------------------------------------
messaging.rabbitmq.host=${RABBITMQ_HOST:}
messaging.rabbitmq.port=${RABBITMQ_PORT:5672}
messaging.rabbitmq.username=${RABBITMQ_USERNAME:}
messaging.rabbitmq.password=${RABBITMQ_PASSWORD:}

# ---------------------------------------------------------------------------
# AWS configuration
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
ssm.config.prefix=${SSM_CONFIG_PREFIX:/mini-app/config}
server.port.param=${SERVER_PORT_PARAM:/mini-app/server/port}

# ---------------------------------------------------------------------------
# General application settings
# ---------------------------------------------------------------------------
environment=${APP_ENVIRONMENT:production}
debug.enabled=${DEBUG_ENABLED:false}
logging.level=${LOG_LEVEL:INFO}
